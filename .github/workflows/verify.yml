# The fast checks, on every push and on every pull request: ./dev verify,
# then the Go vulnerability scan. It reports; it does not stop a push.
#
# The same file runs on both hosts, unedited. Safe for a pull request from
# a fork: it runs on
# `pull_request`, never `pull_request_target`, reads no secrets, and its
# token can only read. On the private host it skips a pull request from a
# fork, so a fork's code never runs on that host's runner.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # The host, told by github.server_url: on GitHub, a hosted runner, which
    # is thrown away after the job, so a fork's pull request runs too.
    # Anywhere else, an empty server_url included, the private host: its
    # own runner (label lp2-verify), where a fork's code must never run, so
    # the if: skips a fork's pull request. Neither line is edited per host.
    if: github.server_url == 'https://github.com' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'lp2-verify' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the commit the run is for
        env:
          COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned tools (tools/versions)
        run: |
          export LP2_TOOLS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/lp2-tools"
          tools/setup foundry go govulncheck >>"$GITHUB_PATH"
      - name: ./dev doctor
        run: ./dev doctor
      - name: ./dev verify
        run: ./dev verify
      - name: Known vulnerabilities reachable from the Go code
        run: programs/vulncheck
