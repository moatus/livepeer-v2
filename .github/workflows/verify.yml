# The fast checks, on every push and on every pull request: ./dev verify,
# then the Go vulnerability scan. It reports; it does not stop a push.
#
# Safe for a pull request from a fork: it runs on `pull_request`, never
# `pull_request_target`, reads no secrets, and its token can only read.
# A fork's code still runs on the runner, so a public repository should use
# a hosted runner.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # The runner. The private host's has this label; elsewhere use a hosted
    # one, such as ubuntu-24.04. Change this line and nothing else.
    runs-on: lp2-verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the commit the run is for
        env:
          COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned tools (tools/versions)
        run: |
          export LP2_TOOLS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/lp2-tools"
          tools/setup foundry go govulncheck >>"$GITHUB_PATH"
      - name: ./dev doctor
        run: ./dev doctor
      - name: ./dev verify
        run: ./dev verify
      - name: Known vulnerabilities reachable from the Go code
        run: programs/vulncheck
