# The fast checks, on every push and on every pull request: ./dev verify,
# then the Go vulnerability scan. It reports; it does not stop a push.
#
# Safe for a pull request from a fork: it runs on `pull_request`, never
# `pull_request_target`, reads no secrets, and its token can only read.
# While the job runs on the private host's runner, it skips a pull request
# from a fork, so a fork's code never runs there.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # The runner: the private host's has this label. A fork's code must
    # never run on it, so the if: skips a fork's pull request. On a hosted
    # runner, such as ubuntu-24.04, change runs-on and delete the if:.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: lp2-verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the commit the run is for
        env:
          COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned tools (tools/versions)
        run: |
          export LP2_TOOLS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/lp2-tools"
          tools/setup foundry go govulncheck >>"$GITHUB_PATH"
      - name: ./dev doctor
        run: ./dev doctor
      - name: ./dev verify
        run: ./dev verify
      - name: Known vulnerabilities reachable from the Go code
        run: programs/vulncheck
