# The fast checks, on every pull request and on every push to main:
# ./dev verify, then the Go vulnerability scan. It reports; it does not
# stop a push. A work branch is checked through its pull request, once: a
# push run of the same commit would only queue ahead of it on the private
# host's single runner.
#
# The same file runs on both hosts, unedited. Safe for a pull request from
# a fork: it runs on
# `pull_request`, never `pull_request_target`, reads no secrets, and its
# token can only read. On the private host the job's if: skips a pull
# request from a fork, but only when the run uses the main branch's copy of
# this file: there a pull request runs with its own copy, which a fork can
# change. What keeps outside code off the private host's runner is that
# only trusted accounts can open pull requests on that host; outside
# contributors open theirs on GitHub.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # The host, told by github.server_url: on GitHub, a hosted runner, which
    # is thrown away after the job, so a fork's pull request runs too.
    # Anywhere else, an empty server_url included, the private host: its
    # own runner (label lp2-verify), where a fork's code must never run. The
    # if: skips a fork's pull request there, which holds only while this is
    # the main branch's file (see the top of this file). Neither line is
    # edited per host.
    if: github.server_url == 'https://github.com' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'lp2-verify' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the commit the run is for
        env:
          COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: The pinned tools (tools/versions)
        run: |
          export LP2_TOOLS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/lp2-tools"
          tools/setup foundry go govulncheck >>"$GITHUB_PATH"
      - name: ./dev doctor
        run: ./dev doctor
      - name: ./dev verify
        run: ./dev verify
      - name: Known vulnerabilities reachable from the Go code
        run: programs/vulncheck
