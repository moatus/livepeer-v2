# Static analysis of the contracts with slither, at the version
# tools/versions pins, whenever the contracts or the pin change. Each
# finding is fixed or accepted, with its reason, in contracts/slither.accepted
# (contracts/slither). ./dev qualify runs the same script. A pull request
# from a fork is handled as in verify.yml, which says what keeps a fork's
# code off the private host's runner.
name: slither

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tools/versions"
      - "tools/setup"
      - "tools/slither-requirements.txt"
      - ".github/workflows/slither.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tools/versions"
      - "tools/setup"
      - "tools/slither-requirements.txt"
      - ".github/workflows/slither.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: slither
    # The runner, and a fork's pull request skipped on the private host
    # only, while this is the main branch's file: see verify.yml. Neither
    # line is edited per host.
    if: github.server_url == 'https://github.com' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'lp2-verify' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The pinned tools (tools/versions)
        run: |
          export LP2_TOOLS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/lp2-tools"
          tools/setup foundry go slither >>"$GITHUB_PATH"
      # As in the other workflows: every tool at its pin, and none broken,
      # before anything runs. Go is installed only because ./dev doctor
      # holds this checkout's Go code to it.
      - name: ./dev doctor
        run: ./dev doctor
      - name: contracts/slither
        run: contracts/slither
