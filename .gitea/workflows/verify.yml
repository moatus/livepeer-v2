# Runs the fast checks on every push, on the host's own runner. It reports;
# it does not stop a push.
name: verify

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: lp2-verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The checkout is the pushed commit
        env:
          PUSHED: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PUSHED"
      - name: ./dev doctor
        run: ./dev doctor
      - name: ./dev verify
        run: ./dev verify
